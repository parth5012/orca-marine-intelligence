# ORCA Marine Intelligence — Docker Compose (Single-Command Stack)
# Owner: M-C (Backend API & Platform)
#
# All services: PostGIS + Redis + Backend (FastAPI) + Frontend (Next.js)
#
# Usage:
#   docker compose up --build          # all 4 services (first build ~2-3 min)
#   docker compose up -d               # detached
#   docker compose down                # stop + remove containers
#   docker compose down -v             # also wipe DB/Redis volumes
#   docker compose logs -f backend     # tail one service
#
# Ports (host:container):
#   5432:5432  PostGIS  (host 5432 must be free — stop local postgres if needed)
#   6379:6379  Redis    (inside Docker:6379; bare-metal .env uses 7379 to dodge conflicts)
#   5000:8000  Backend  (8000 blocked on Windows by Hyper-V excluded range 7945-8044 → WinError 10013)
#   3000:3000  Frontend (Next.js)
#
# PROD WARNING: POSTGRES_PASSWORD=orca is a dev default — override via .env
# (POSTGRES_PASSWORD=<strong-random>, e.g. openssl rand -hex 32) and do NOT
# expose 5432/6379 to the public internet. In prod either drop the `ports:`
# entries for postgis/redis (internal Docker network only) or firewall them
# to trusted hosts. Never commit a real password to git.
#
# Env: .env is auto-loaded. Docker overrides DATABASE_URL/REDIS_URL to use
# service hostnames (postgis/redis). Add secrets to .env, not here.

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: orca-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: orca_marine
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca -d orca_marine"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orca-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: orca-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Override host-specific URLs with Docker-network hostnames
      DATABASE_URL: postgresql://orca:orca@postgis:5432/orca_marine
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    ports:
      # 8000 → WinError 10013 on Windows host; expose 5000 instead
      - "5000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || curl -sf http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orca-frontend
    restart: unless-stopped
    environment:
      # Server-side proxy (Next.js route handlers) → backend container
      BACKEND_API_URL: http://backend:8000
      # Client-side fetch (browser) → host-mapped backend port
      NEXT_PUBLIC_API_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgis_data:
  redis_data:
