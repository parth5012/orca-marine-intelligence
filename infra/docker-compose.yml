# ORCA Marine Intelligence — Docker Compose (Local Development)
# Owner: M6 (Platform)
#
# Services:
#   - postgis   : PostgreSQL + PostGIS (port 5432)
#   - redis     : Redis cache (port 6379)
#   - backend   : FastAPI application (port 8000)
#
# Usage:
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: orca-postgis
    environment:
      POSTGRES_DB: orca_marine
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ../backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca -d orca_marine"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orca-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: orca-backend
    environment:
      DATABASE_URL: postgresql://orca:orca@postgis:5432/orca_marine
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgis_data:
  redis_data:
